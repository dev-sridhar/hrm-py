<!-- Reusable Reset / Clear Button Component -->
{# Parameters: href (default: '?'), onclick, title (default: "Reset Filters"), text (default: "Reset"), icon_only (default: False), extra_class, style #}
{% if onclick %}
<button type="button" 
        onclick="{{ onclick }}" 
        class="{% if icon_only %}btn-action-icon btn-reset-icon{% else %}btn-custom btn-custom-outline{% endif %} {{ extra_class }}" 
        {% if style %}style="{{ style }}"{% endif %}
        title="{{ title|default:'Reset Filters' }}">
    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.033 8.033 0 01-15.357-2m15.357 2H15"></path>
    </svg>
    {% if not icon_only %}
    <span>{{ text|default:'Reset' }}</span>
    {% endif %}
</button>
{% else %}
<a href="{{ href|default:'?' }}" 
   class="{% if icon_only %}btn-action-icon btn-reset-icon{% else %}btn-custom btn-custom-outline{% endif %} {{ extra_class }}" 
   {% if style %}style="{{ style }}"{% endif %}
   title="{{ title|default:'Reset Filters' }}">
    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.033 8.033 0 01-15.357-2m15.357 2H15"></path>
    </svg>
    {% if not icon_only %}
    <span>{{ text|default:'Reset' }}</span>
    {% endif %}
</a>
{% endif %}
