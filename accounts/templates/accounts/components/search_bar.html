<!-- Reusable Search Bar Component -->
{# Parameters: input_id (default: searchInput), name (default: q), value (default: search_query), placeholder, oninput, onclear, max_width, extra_class, style #}
<div class="proper-search-input-box {{ extra_class }}" style="position: relative; display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 0 10px; transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.02); {% if max_width %}max-width: {{ max_width }};{% endif %} {{ style }}">
    <div class="search-prefix-icon" style="color: var(--text-muted); display: flex; align-items: center; flex-shrink: 0; margin-right: 6px;">
        <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>
    <input type="text" 
           name="{{ name|default:'q' }}" 
           id="{{ input_id|default:'searchInput' }}" 
           value="{{ value|default:'' }}" 
           placeholder="{{ placeholder|default:'Search...' }}" 
           class="proper-search-field" 
           style="width: 100%; padding: 7px 0; border: none; background: transparent; outline: none; font-size: 13px; font-family: inherit; color: var(--text-main);"
           autocomplete="off" 
           oninput="const btn = document.getElementById('{{ input_id|default:'searchInput' }}_clearBtn'); if(btn) btn.style.display = this.value.trim() ? 'flex' : 'none'; {% if oninput %}{{ oninput }}{% endif %}">
    <button type="button" 
            id="{{ input_id|default:'searchInput' }}_clearBtn" 
            onclick="{% if onclear %}{{ onclear }}{% else %}const inp = document.getElementById('{{ input_id|default:'searchInput' }}'); if(inp) { inp.value = ''; inp.dispatchEvent(new Event('input')); inp.focus(); } this.style.display = 'none';{% endif %}" 
            class="search-clear-btn" 
            style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; display: {% if value %}flex{% else %}none{% endif %}; align-items: center; justify-content: center; transition: color 0.15s ease;" 
            title="Clear search">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>
