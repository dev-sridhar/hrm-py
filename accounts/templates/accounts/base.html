<!DOCTYPE html>
<html lang="en" data-theme="light" data-color="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Portal - Sign In{% endblock %}</title>
    <!-- Instant Theme Loader (Zero FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('app-theme') || 'light';
            const savedColor = localStorage.getItem('app-color') || 'purple';
            document.documentElement.setAttribute('data-color', savedColor);
            if (savedTheme === 'system') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', prefersDark ? 'night' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7c5dfa;
            --primary-hover: #6c47ff;
            --primary-light: #f3effe;
            --primary-gradient: linear-gradient(135deg, #7c5dfa 0%, #6366f1 100%);
            --primary-shadow: rgba(124, 93, 250, 0.28);

            --bg-gradient: linear-gradient(135deg, #f8f9fe 0%, #edf1fd 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #edf2f7;
            --input-bg: #ffffff;
            --card-shadow: 0 20px 45px -10px rgba(112, 128, 176, 0.18), 0 4px 12px rgba(112, 128, 176, 0.08);

            --error-bg: #feeef0;
            --error-text: #f43f5e;
            --error-border: rgba(244, 63, 94, 0.3);
            --success-bg: #eafaf1;
            --success-text: #10b981;
            --success-border: rgba(16, 185, 129, 0.3);
            --info-bg: #f3effe;
            --info-text: #7c5dfa;
            --info-border: rgba(124, 93, 250, 0.3);
        }

        [data-theme="night"] {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            --card-bg: #111827;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: #1f2937;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: var(--card-shadow);
            transition: all 0.25s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: var(--primary-light);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px var(--primary-shadow);
        }

        .logo-icon svg { width: 28px; height: 28px; }

        .auth-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-icon svg { width: 18px; height: 18px; }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--primary-shadow);
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--primary-shadow);
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        /* Top-Right Flash Toast Container */
        .toast-notifications-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: calc(100vw - 48px);
            pointer-events: none;
        }

        .toast-flash-card {
            pointer-events: auto;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px 16px 16px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 32px -4px rgba(15, 23, 42, 0.18);
            color: var(--text-main);
            overflow: hidden;
            animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .toast-flash-card.toast-hiding {
            opacity: 0;
            transform: translateX(100%) scale(0.95);
        }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateX(80px) scale(0.92); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        .toast-flash-card.toast-success { border-left: 4px solid #10b981; }
        .toast-flash-card.toast-error { border-left: 4px solid #f43f5e; }
        .toast-flash-card.toast-warning { border-left: 4px solid #f59e0b; }
        .toast-flash-card.toast-info { border-left: 4px solid var(--primary); }

        .toast-icon-badge {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .toast-success .toast-icon-badge { background: var(--success-bg); color: var(--success-text); }
        .toast-error .toast-icon-badge { background: var(--error-bg); color: var(--error-text); }
        .toast-warning .toast-icon-badge { background: #fef6e8; color: #f59e0b; }
        .toast-info .toast-icon-badge { background: var(--info-bg); color: var(--info-text); }

        .toast-body-text {
            flex-grow: 1;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            padding-top: 4px;
        }

        .toast-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .toast-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(124, 93, 250, 0.15);
        }
        .toast-progress-fill {
            height: 100%;
            width: 100%;
            animation: toastProgress 3s linear forwards;
        }
        .toast-success .toast-progress-fill { background: #10b981; }
        .toast-error .toast-progress-fill { background: #f43f5e; }
        .toast-warning .toast-progress-fill { background: #f59e0b; }
        .toast-info .toast-progress-fill { background: var(--primary); }

        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .alert-error { background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
        .alert-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
        .alert-info { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
    </style>
</head>
<body>
    <!-- Top-Right Flash / Toast Notifications Container -->
    <div class="toast-notifications-container" id="toastContainer">
        {% if messages %}
            {% for message in messages %}
            <div class="toast-flash-card toast-{{ message.tags|default:'info' }}" data-autoclose="true">
                <div class="toast-icon-badge">
                    {% if message.tags == 'error' %}
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    {% elif message.tags == 'success' %}
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                    {% else %}
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    {% endif %}
                </div>
                <div class="toast-body-text">
                    {{ message }}
                </div>
                <button type="button" class="toast-close-btn" onclick="dismissToast(this.closest('.toast-flash-card'))" title="Close notification">&times;</button>
                <div class="toast-progress-bar">
                    <div class="toast-progress-fill"></div>
                </div>
            </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block content %}{% endblock %}

    <script>
        function dismissToast(toastEl) {
            if (!toastEl || toastEl.classList.contains('toast-hiding')) return;
            toastEl.classList.add('toast-hiding');
            setTimeout(() => {
                if (toastEl && toastEl.parentNode) {
                    toastEl.parentNode.removeChild(toastEl);
                }
            }, 320);
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.toast-flash-card[data-autoclose="true"]').forEach(toast => {
                let timer = setTimeout(() => {
                    dismissToast(toast);
                }, 3000);

                toast.addEventListener('mouseenter', () => clearTimeout(timer));
                toast.addEventListener('mouseleave', () => {
                    timer = setTimeout(() => dismissToast(toast), 1500);
                });
            });
        });
    </script>
</body>
</html>
